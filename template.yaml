AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  tech-challenge-fase3-serverless-auth
  Função Lambda para autenticação de clientes via CPF.

Globals:
  Function:
    Timeout: 30
    MemorySize: 256

Resources:
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: app.handler
      Runtime: nodejs18.x
      Architectures:
        - x86_64
      # Role do AWS Academy (necessária para o Learner Lab não bloquear)
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"

      # 👇 Coloca a Lambda DENTRO da VPC, pra ela alcançar o RDS privado.
      #    Usa a MESMA subnet do RDS (subnet-0e6.../us-east-1a) e o SG do RDS.
      #    (Ficar na mesma subnet do RDS evita depender de NACL entre subnets.)
      VpcConfig:
        SubnetIds:
          - subnet-0e66981f57714d07c
        SecurityGroupIds:
          - sg-0f94c8b808059d61a

      Environment:
        Variables:
          # 👇 URL real do RDS (o mesmo do k8s/secret.yaml do app)
          DATABASE_URL: "postgresql://postgres:OficinaFiap2026!@oficina-db-prod.ctomhztfsbks.us-east-1.rds.amazonaws.com:5432/postgres"
          # 👇 MESMO segredo do app (k8s/secret.yaml), senão o app rejeita o token da Lambda
          JWT_SECRET: "seu-segredo-super-seguro-aqui"
      Events:
        AuthApi:
          Type: Api
          Properties:
            Path: /auth
            Method: post